name: vaultwarden

services:
  vaultwarden:
    container_name: vaultwarden
    image: vaultwarden/server:${VAULTWARDEN_VERSION}
    restart: unless-stopped
    environment:
      DOMAIN: https://${TS_FQDN}:8443
      SIGNUPS_ALLOWED: ${SIGNUPS_ALLOWED}
      INVITATIONS_ALLOWED: "false"
      SHOW_PASSWORD_HINT: "false"
      # No ADMIN_TOKEN: the /admin page stays disabled, which removes one way in
      TZ: ${TZ}
    volumes:
      # SQLite database and keys stay on the VM disk; backed up nightly to /mnt/backups/vaultwarden
      - ./data:/data
    # Only reachable from inside the VM; Tailscale Serve adds HTTPS (required by the Bitwarden clients)
    ports:
      - "127.0.0.1:8082:80"
