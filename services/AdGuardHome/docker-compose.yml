name: adguardhome

services:
  adguardhome:
    container_name: adguardhome
    image: adguard/adguardhome:${ADGUARD_VERSION:-v0.107.78}
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      # Setup wizard and admin page. In the wizard, keep the admin interface on port 3000.
      - "3000:3000/tcp"
    volumes:
      - ./work:/opt/adguardhome/work
      - ./conf:/opt/adguardhome/conf
